<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agente Qwen - Casino</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e293b; padding: 1rem; border-bottom: 1px solid #334155; text-align: center; }
        header h1 { margin: 0; font-size: 1.2rem; color: #38bdf8; }
        #chat-container { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
        .message { max-width: 90%; padding: 0.8rem 1rem; border-radius: 1rem; line-height: 1.5; word-wrap: break-word; }
        .user { align-self: flex-end; background: #0284c7; color: white; }
        .agent { align-self: flex-start; background: #334155; color: #e2e8f0; }
        .agent pre { background: #0f172a; padding: 0.5rem; border-radius: 0.5rem; overflow-x: auto; font-size: 0.85rem; }
        #input-area { background: #1e293b; padding: 1rem; border-top: 1px solid #334155; display: flex; gap: 0.5rem; }
        #user-input { flex: 1; padding: 0.8rem; border-radius: 0.5rem; border: 1px solid #475569; background: #0f172a; color: white; }
        #send-btn { padding: 0.8rem 1.2rem; background: #0284c7; color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: bold; }
        #send-btn:disabled { background: #475569; cursor: not-allowed; }
        .typing { font-style: italic; color: #94a3b8; font-size: 0.85rem; margin-left: 1rem; display: none; }
        .acciones { font-size: 0.85rem; color: #4ade80; margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid #475569; }
    </style>
</head>
<body>
    <header><h1>🤖 Agente Qwen | Proyecto Casino</h1></header>
    <div id="chat-container"></div>
    <div class="typing" id="typing">El agente está pensando y ejecutando...</div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Escribe tu instruccion aqui..." autocomplete="off">
        <button id="send-btn">Enviar</button>
    </div>
    <script>
        const chat = document.getElementById('chat-container');
        const input = document.getElementById('user-input');
        const btn = document.getElementById('send-btn');
        const typing = document.getElementById('typing');
        let history = [];

        function addMsg(role, text, acciones) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            let html = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
            html = html.replace(/```(\w+)?<br>([\s\S]*?)<br>```/g, '<pre><code>$2</code></pre>');
            div.innerHTML = html;
            if (acciones && acciones.length > 0) {
                const accDiv = document.createElement('div');
                accDiv.className = 'acciones';
                accDiv.innerHTML = '<strong>Acciones:</strong><br>' + acciones.map(a => '✅ ' + a).join('<br>');
                div.appendChild(accDiv);
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function send() {
            const text = input.value.trim();
            if (!text) return;
            addMsg('user', text);
            input.value = '';
            btn.disabled = true;
            typing.style.display = 'block';

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: history })
                });
                const data = await res.json();
                if (data.error) addMsg('agent', '❌ Error: ' + data.error);
                else {
                    addMsg('agent', data.response, data.acciones_ejecutadas);
                    history = data.history;
                }
            } catch (e) {
                addMsg('agent', '❌ Error de conexion: ' + e.message);
            } finally {
                btn.disabled = false;
                typing.style.display = 'none';
                input.focus();
            }
        }

        btn.addEventListener('click', send);
        input.addEventListener('keypress', function(e) { if (e.key === 'Enter') { e.preventDefault(); send(); } });
        input.focus();
    </script>
</body>
</html>
